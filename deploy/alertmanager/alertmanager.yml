global:
  resolve_timeout: 5m

route:
  receiver: cad-webhook
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: cad-webhook
    webhook_configs:
      - url: http://api:8000/api/alerts
        send_resolved: true
        http_config:
          headers:
            X-Alert-Token: change-me
