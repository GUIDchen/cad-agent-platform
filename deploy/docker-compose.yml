services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cad
      POSTGRES_USER: cad
      POSTGRES_PASSWORD: cad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cad
      MINIO_ROOT_PASSWORD: cad-secret
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cad:cad@db:5432/cad
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      STORAGE_DIR: /data/storage
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cad-platform
      S3_ACCESS_KEY: cad
      S3_SECRET_KEY: cad-secret
      S3_REGION: us-east-1
      EXECUTION_MODE: queue
      WORKER_TOKEN: change-me
      SECRET_KEY: change-me
      WECOM_MODE: mock
      NOTIFY_MODE: mock
      AUTO_CREATE_SCHEMA: "true"
      ALLOW_DEV_AUTH: "false"
      WECOM_ACTION_TOKEN: change-me
      ALERT_WEBHOOK_TOKEN: change-me
      WECOM_TOKEN: ""
      WECOM_ENCODING_AES_KEY: ""
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: deepseek-flash
      IMAGE_API_URL: ""
      IMAGE_API_KEY: ""
      COMFY_URL: ""
      COMFY_WORKFLOW: ""
      COMFY_TIMEOUT: "120"
      VIRUS_SCAN_MODE: mock
      CLAMAV_COMMAND: clamdscan
      ERP_WEBHOOK_URL: ""
      ERP_WEBHOOK_TOKEN: ""
      GLOBAL_RATE_LIMIT: "240"
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://cad:cad@db:5432/cad
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      STORAGE_DIR: /data/storage
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cad-platform
      S3_ACCESS_KEY: cad
      S3_SECRET_KEY: cad-secret
      S3_REGION: us-east-1
      EXECUTION_MODE: queue
      SECRET_KEY: change-me
      NOTIFY_MODE: mock
      WECOM_MODE: mock
      ALLOW_DEV_AUTH: "false"
      AUTO_CREATE_SCHEMA: "true"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  appdata:
  redisdata:
  grafanadata:
